<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234b32" />
      <stop offset="45%" stop-color="#B8934A" />
      <stop offset="100%" stop-color="#C8AD78" />
    </linearGradient>
  </defs>
  <!-- Clean white rounded backdrop matching brand logo canvas -->
  <rect width="128" height="128" rx="28" fill="#ffffff" />
  <rect width="122" height="122" x="3" y="3" rx="25" fill="none" stroke="#234b32" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Iconic GreenNest Monogram matching the exact uploaded logo styling -->
  <g font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700">
    <!-- Letter G in Forest Green -->
    <text x="18" y="88" font-size="74" fill="#234b32" letter-spacing="-2">G</text>
    <!-- Letter N with Brand Golden Gradient -->
    <text x="62" y="88" font-size="74" fill="url(#gnGold)" letter-spacing="-2">N</text>
  </g>
  <!-- Accent gold dot & base bar -->
  <circle cx="107" cy="85" r="4.5" fill="#C8AD78" />
  <rect x="22" y="99" width="84" height="4" rx="2" fill="#234b32" />
</svg>
